port: 4222
http_port: 8222

# Browsers cannot open raw NATS connections, so the WSS GUI (and any other
# in-browser Measurement Plane client) joins over this websocket listener.
# no_tls is fine on a trusted lab network; a page served over HTTPS will refuse
# a plain ws:// connection and needs TLS configured here instead.
websocket {
  port: 8080
  no_tls: true
}

jetstream {
  store_dir: "/data"
}

max_payload: 52428800
