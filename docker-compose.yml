services:

  nats:
    image: nats:2.10
    container_name: nats
    ports:
      - "4222:4222"
      # Websocket listener for in-browser clients such as the WSS GUI.
      - "8080:8080"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    command: ["-c", "/etc/nats/nats.conf"]

  experiment-orchestrator:
    image: ghcr.io/measurement-plane/experiment-orchestrator:latest
    container_name: experiment-orchestrator
    environment:
      - BROKER_URL=${BROKER_URL}
    ports:
      - "${ORCHESTRATOR_HOST_PORT:-18080}:8080"
    depends_on:
      - nats

  measurement-plane-gui:
    image: ghcr.io/measurement-plane/gui:latest
    container_name: measurement_plane_gui
    ports:
      - "8050:8050"
    depends_on:
      - measurement-api
      - topology-service

  measurement-api:
    image: ghcr.io/measurement-plane/gui-api:latest
    container_name: measurement_plane_api
    environment:
      - BROKER_URL=${BROKER_URL}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - AUTH_SECRET=${AUTH_SECRET:-change-this-in-production}
      - TOPOLOGY_SERVICE_URL=http://topology-service:8001
    depends_on:
      - nats
      - topology-service

  topology-service:
    image: ghcr.io/measurement-plane/topology-service:latest
    container_name: topology_service
    environment:
      - BROKER_URL=${BROKER_URL}
    volumes:
      - topology-data:/data
      - ./secrets/supervisor-pki/ca.crt:/run/secrets/supervisor-ca.crt:ro
      - ./secrets/supervisor-pki/topology-client.crt:/run/secrets/topology-client.crt:ro
      - ./secrets/supervisor-pki/topology-client.key:/run/secrets/topology-client.key:ro
    depends_on:
      - nats

  coincidences-analyzer:
    image: ghcr.io/measurement-plane/coincidences-analyzer:latest
    container_name: coincidences_analyzer_agent_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=coincidences_analyzer
    depends_on:
      - nats

  polarization-analyzer:
    image: ghcr.io/measurement-plane/polarization-analyzer:latest
    container_name: polarization_analyzer_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=polarization_analyzer
    depends_on:
      - nats

  twtt-capability:
    image: ghcr.io/measurement-plane/twtt-capability:latest
    container_name: twtt_capability_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=${TWTT_ENDPOINT:-/twtt}
    depends_on:
      - nats
      - coincidences-analyzer

  entanglement-distribution:
    image: ghcr.io/measurement-plane/entanglement-distribution:latest
    container_name: entanglement_distribution_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=${ENTANGLEMENT_DISTRIBUTION_ENDPOINT:-/entanglement-distribution}
      - TOPOLOGY_SERVICE_URL=http://topology-service:8001
      - POLARIZATION_ANALYZER_ENDPOINT=${POLARIZATION_ANALYZER_ENDPOINT:-polarization_analyzer}
      - COINCIDENCES_ENDPOINT=${COINCIDENCES_ENDPOINT:-coincidences_analyzer}
      - COINCIDENCES_PEAK0_PS=${ENTANGLEMENT_PEAK0_PS:-0}
      - COINCIDENCES_RANGE_NS=${ENTANGLEMENT_RANGE_NS:-10}
      - COINCIDENCES_TIME_BIN_NS=${ENTANGLEMENT_TIME_BIN_NS:-0.1}
      - COINCIDENCES_WINDOW_NS=${ENTANGLEMENT_WINDOW_NS:-1}
      - COINCIDENCES_INTEGRATION_MS=${ENTANGLEMENT_INTEGRATION_MS:-100}
    depends_on:
      - nats
      - topology-service
      - polarization-analyzer
      - coincidences-analyzer

  apc-service:
    image: ghcr.io/measurement-plane/apc-service:latest
    container_name: apc_service_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=${APC_ENDPOINT:-/apc/main}
      - APC_DRIVER_TYPE=${APC_DRIVER_TYPE:-qunnect}
      - APC_REQUEST_TIMEOUT_S=${APC_REQUEST_TIMEOUT_S:-10}
      - APC_VERIFY_SSL=${APC_VERIFY_SSL:-true}
    depends_on:
      - nats

volumes:
  topology-data:
