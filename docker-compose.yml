services:

  nats:
    image: nats:2.10
    container_name: nats
    ports:
      - "4222:4222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    command: ["-c", "/etc/nats/nats.conf"]

  experiment-orchestrator:
    image: ghcr.io/measurement-plane/experiment-orchestrator:latest
    container_name: experiment-orchestrator
    environment:
      - BROKER_URL=${BROKER_URL}
    ports:
      - "8080:8080"
    depends_on:
      - nats

  measurement-plane-gui:
    image: ghcr.io/measurement-plane/gui:latest
    container_name: measurement_plane_gui
    environment:
      - BROKER_URL=${BROKER_URL}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL}
      - ORCHESTRATOR_PUBLIC_URL=${ORCHESTRATOR_PUBLIC_URL:-http://localhost:8080}
      - GUI_SECRET_KEY=${GUI_SECRET_KEY:-measurement-plane-gui-secret}
      - GUI_DEBUG=${GUI_DEBUG:-false}
      - GUI_DB_PATH=${GUI_DB_PATH:-/data/gui.db}
      - GUI_BOOTSTRAP_ADMIN_USERNAME=${GUI_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - GUI_BOOTSTRAP_ADMIN_PASSWORD=${GUI_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    volumes:
      - gui-data:${GUI_DB_PATH_DIR:-/data}
    ports:
      - "8050:8050"

  coincidences-analyzer:
    image: ghcr.io/measurement-plane/coincidences-analyzer:latest
    container_name: coincidences_analyzer_agent_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=coincidences_analyzer
    depends_on:
      - nats

  polarization-analyzer:
    image: ghcr.io/measurement-plane/polarization-analyzer:latest
    container_name: polarization_analyzer_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=polarization_analyzer
    depends_on:
      - nats

  apc-service:
    image: ghcr.io/measurement-plane/apc-service:latest
    container_name: apc_service_container
    environment:
      - BROKER_URL=${BROKER_URL}
      - ENDPOINT=${APC_ENDPOINT:-/apc/main}
      - APC_DRIVER_TYPE=${APC_DRIVER_TYPE:-qunnect}
      - APC_API_BASE_URL=${APC_API_BASE_URL:-http://127.0.0.1:8000/qunnect-api}
      - APC_DEVICE_ID=${APC_DEVICE_ID:-apc-01}
      - APC_REQUEST_TIMEOUT_S=${APC_REQUEST_TIMEOUT_S:-10}
      - APC_VERIFY_SSL=${APC_VERIFY_SSL:-true}
    depends_on:
      - nats

volumes:
  gui-data:
